# Render Blueprint: New > Blueprint in the Render dashboard, then point it at this repo.
services:
  - type: web
    name: ot-equipment
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ot-equipment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2

databases:
  - name: ot-equipment-db
    plan: free
    region: frankfurt
