# Render Blueprint. In the Render dashboard: New > Blueprint, pick this repo and the branch to deploy.
# Render asks for the "sync: false" values once, when the Blueprint is created.
services:
  - type: web
    name: ot-equipment
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ot-equipment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SUPERUSER_USERNAME  # the admin login, created by build.sh on the first deploy
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DEVICE_TOKEN               # readers posting to /api/tag-read/ must send it as X-Device-Token
        generateValue: true
      - key: SEED_DEMO                  # 1 = load invented demo data into an empty database; 0 = start empty
        value: "1"

databases:
  - name: ot-equipment-db
    plan: free
    region: frankfurt
